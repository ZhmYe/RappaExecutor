syntax = "proto3";

package coordinator;
import "google/protobuf/struct.proto";
option go_package = "/service";
service Coordinator {
  // Heartbeat 向follower同步slot状态，同时监控节点状态
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

  // Schedule 用于向节点发送调度
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);

  // SlotVote 投票slot，用于上链
  rpc SlotVote (SlotVoteRequest) returns (SlotVoteResponse);
}

// Heartbeat request message
message HeartbeatRequest {
  map<string, string> slotDistribution = 1; // Slot distribution across nodes
}

// Heartbeat response message
message HeartbeatResponse {
  string nodeId = 1;               // Node ID of the sender
  map<string, string> nodeStatus = 2; // Node status for monitoring
  repeated string newSlots = 3;       // New slots if any
}

// SlotVote request message
message SlotVoteRequest {
  repeated string slots = 1; // Slots to be voted on
}

// SlotVote response message
message SlotVoteResponse {
  string nodeId = 1;           // Node ID of the sender
  bytes voteBitmap = 2;        // Bitmap of the vote
}

message ScheduleRequest {
  string sign = 1; // 任务标记
  string size = 2; // 数据总量
  map<string, string> schedule = 3; // 分配，节点id: 数据量
  string model = 4; // 模型名称
  // 用于得到model params
  google.protobuf.Struct params = 5;       // Dynamic details, accepts JSON-like structures
}
message ScheduleResponse {
  bool accept = 1; // 是否同意该调度
  string nodeId = 2;
  string sign = 3;
  string errorMessage = 4; // 拒绝的理由
}